[project]
name = "prompt-engineering-public"
version = "1.1.0"
description = "Check je prompts tegen 6 bewezen anti-patronen — score 0-10, advies inbegrepen."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Tiëndo Welles — Parvenu Agent Family"}]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["check_prompt"]

[project.scripts]
check-prompt = "check_prompt:main"

[tool.pytest.ini_options]
testpaths = ["tests", "test_prompt_engineering.py"]
